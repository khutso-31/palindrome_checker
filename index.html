<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>Palindrome Checker</h1>

        <form id="palindromeForm" novalidate>
          <label for="textInput">Enter a word or phrase</label>
          <input id="textInput" type="text" placeholder="Type here..." autocomplete="off" />

          <div class="button-row">
            <button id="checkButton" type="submit">Check</button>
            <button id="clearButton" type="button" class="secondary">Clear History</button>
          </div>
        </form>

        <p id="result" aria-live="polite">Waiting for input...</p>
      </section>

      <section class="history-panel card">
        <h2>Previous Checks</h2>
        <ul id="historyList" aria-live="polite">
          <li class="empty-state">No checks yet.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
